{% extends "base.html" %}
{% block main %}

    <div class="d-flex justify-content-center gap-4 flex-wrap">
        <div class="carte-choix">
            <h2>Se connecter</h2>
            <p>Vous avez déjà un compte Fest'IUT'O ? Connectez-vous.</p>
            <a href="{{ url_for('auth.login') }}" class="btn btn-festiuto">Se connecter</a>

    </div>

{% endblock %}
